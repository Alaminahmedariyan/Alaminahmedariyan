<svg width="1200" height="340" viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="55%" stop-color="#0a0f1c"/>
      <stop offset="100%" stop-color="#050a12"/>
    </linearGradient>

    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#22d3ee" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowSoft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="1"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c7f3ff"/>
    </linearGradient>

    <filter id="blur1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="65"/>
    </filter>

    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1c2a3a" stroke-width="1" opacity="0.35"/>
    </pattern>

    <mask id="fadeMask">
      <rect width="1200" height="340" fill="url(#fadeGrad)"/>
    </mask>
    <linearGradient id="fadeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="white" stop-opacity="0.1"/>
      <stop offset="35%" stop-color="white" stop-opacity="1"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- base background -->
  <rect width="1200" height="340" fill="url(#bg)"/>

  <!-- grid texture -->
  <rect width="1200" height="340" fill="url(#grid)" mask="url(#fadeMask)"/>

  <!-- glow orbs -->
  <circle cx="980" cy="80" r="270" fill="url(#glowCyan)" filter="url(#blur1)"/>
  <circle cx="120" cy="300" r="230" fill="url(#glowSoft)" filter="url(#blur2)"/>
  <circle cx="1040" cy="260" r="150" fill="url(#glowCyan)" filter="url(#blur2)" opacity="0.5"/>

  <!-- fine border frame -->
  <rect x="1.5" y="1.5" width="1197" height="337" fill="none" stroke="#1c2a3a" stroke-width="1" opacity="0.7"/>

  <!-- corner accents -->
  <path d="M 40 30 L 40 50 M 40 30 L 60 30" stroke="#22d3ee" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M 1160 310 L 1160 290 M 1160 310 L 1140 310" stroke="#22d3ee" stroke-width="2" fill="none" opacity="0.8"/>

  <!-- eyebrow tag -->
  <rect x="60" y="56" width="150" height="26" rx="13" fill="none" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="1"/>
  <circle cx="76" cy="69" r="4" fill="#22d3ee"/>
  <text x="90" y="73" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" letter-spacing="2" fill="#7fe4fa" font-weight="600">AVAILABLE FOR HIRE</text>

  <!-- name -->
  <text x="58" y="148" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="url(#textGrad)">Alamin Islam</text>

  <!-- divider line -->
  <rect x="60" y="168" width="360" height="2" fill="url(#lineGrad)"/>

  <!-- title -->
  <text x="58" y="200" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#8fb4c9">
    Full-Stack Developer <tspan fill="#22d3ee">·</tspan> AI Automation Specialist
  </text>

  <!-- skill chips row 1 -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#9fd8ea">
    <rect x="58" y="222" width="80" height="28" rx="14" fill="#0e1826" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="98" y="240" text-anchor="middle">React</text>

    <rect x="150" y="222" width="90" height="28" rx="14" fill="#0e1826" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="195" y="240" text-anchor="middle">Next.js</text>

    <rect x="252" y="222" width="110" height="28" rx="14" fill="#0e1826" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="307" y="240" text-anchor="middle">TypeScript</text>

    <rect x="374" y="222" width="100" height="28" rx="14" fill="#0e1826" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="424" y="240" text-anchor="middle">Node.js</text>

    <rect x="486" y="222" width="94" height="28" rx="14" fill="#0e1826" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="533" y="240" text-anchor="middle">Express</text>
  </g>

  <!-- skill chips row 2 -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#9fd8ea">
    <rect x="58" y="262" width="112" height="28" rx="14" fill="#0e1826" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="114" y="280" text-anchor="middle">PostgreSQL</text>

    <rect x="182" y="262" width="82" height="28" rx="14" fill="#0e1826" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="223" y="280" text-anchor="middle">Prisma</text>

    <rect x="276" y="262" width="118" height="28" rx="14" fill="#0e1826" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="335" y="280" text-anchor="middle">Tailwind CSS</text>

    <rect x="406" y="262" width="66" height="28" rx="14" fill="#0e1826" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="439" y="280" text-anchor="middle">n8n</text>

    <rect x="484" y="262" width="112" height="28" rx="14" fill="#0e1826" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="540" y="280" text-anchor="middle">LangChain</text>
  </g>
</svg>
